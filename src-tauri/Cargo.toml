[package]
name = "wavescan"
version = "0.0.1"
description = "Reads Wuthering Waves echoes from the game window and exports them for Wuthering Tools"
license = "GPL-3.0-or-later"
repository = "https://github.com/wavescan/wavescan"
edition = "2024"
rust-version = "1.99"
publish = false

[lib]
# `_lib` suffix avoids a name clash with the binary on Windows (Tauri convention).
name = "wavescan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Lint policy: docs/adr/0015-rust-code-standards.md. CI runs clippy with `-D warnings`,
# so every "warn" below fails the build. Allow a lint only on a specific item, with a reason.
[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
undocumented_unsafe_blocks = "deny"
missing_errors_doc = "warn"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
