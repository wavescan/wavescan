[package]
name = "wavescan"
version = "0.0.1"
description = "Reads Wuthering Waves echoes from the game window and exports them for Wuthering Tools"
license = "GPL-3.0-or-later"
repository = "https://github.com/wavescan/wavescan"
edition = "2024"
rust-version = "1.99"
publish = false

[lib]
# `_lib` suffix avoids a name clash with the binary on Windows (Tauri convention).
name = "wavescan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# The F8 stop key for auto mode (ADR 0024): RegisterHotKey / RegisterEventHotKey, held only
# while auto mode is armed. The webview gets no global-shortcut permission.
tauri-plugin-global-shortcut = "2"
# Opens GitHub pages in the user's browser for Help & feedback (ADR 0028). Scoped in
# capabilities/default.json to the repository's pages and the Fair Play policy only.
tauri-plugin-opener = "2"

# Only for examples/fixtures.rs (masking and OCR-replaying fixture screenshots). Already in
# Cargo.lock through Tauri, so it adds no new crate.
[dev-dependencies]
png = "0.18"

# macOS-only OS adapters (src/platform/macos/). See ADR 0004 (OCR), 0005 (capture), 0018.
# Keep objc2 versions/features in sync with scripts/macos-probe/Cargo.toml.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
dispatch2 = "0.3"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString", "NSDictionary", "NSError", "NSObject"] }
objc2-screen-capture-kit = { version = "0.3", features = ["SCShareableContent", "SCStream", "objc2-core-media", "objc2-core-graphics", "block2", "dispatch2", "libc"] }
objc2-core-media = { version = "0.3", features = ["CMSampleBuffer", "CMTime", "objc2-core-video"] }
objc2-core-video = { version = "0.3", features = ["CVPixelBuffer", "CVImageBuffer", "CVBuffer", "CVReturn", "CVBase"] }
objc2-core-foundation = { version = "0.3", features = ["CFData", "CFCGTypes", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-graphics = { version = "0.3", features = ["CGImage", "CGDataProvider", "CGColorSpace", "CGEvent", "CGEventTypes", "CGRemoteOperation", "CGEventSource"] }
objc2-vision = { version = "0.3", features = ["VNRequest", "VNRecognizeTextRequest", "VNRequestHandler", "VNObservation", "VNTypes", "objc2-core-graphics"] }
objc2-app-kit = { version = "0.3", features = ["NSRunningApplication", "NSWorkspace"] }
objc2-application-services = { version = "0.3", features = ["HIServices", "AXUIElement"] }

# Windows-only OS adapters (src/platform/windows/). See ADR 0004 (OCR) and ADR 0005 (capture).
[target.'cfg(windows)'.dependencies]
windows-capture = "2"
windows = { version = "0.62", features = [
  "Foundation",
  "Foundation_Collections",
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_System_WinRT",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

# Lint policy: docs/adr/0015-rust-code-standards.md. CI runs clippy with `-D warnings`,
# so every "warn" below fails the build. Allow a lint only on a specific item, with a reason.
[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
undocumented_unsafe_blocks = "deny"
missing_errors_doc = "warn"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
