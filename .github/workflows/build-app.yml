name: Build app

# Builds the Windows installer and the macOS app for tester-build.yml and release.yml, at a
# given version, with signed update files for in-app updates (ADR 0035). Not run directly.
#
# The updater key (secrets TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD)
# signs the update files. Without it a tester build still builds, but can't be offered as
# an update; a release fails instead (require-update-signing).

on:
  workflow_call:
    inputs:
      version:
        description: "App version, e.g. 0.2.0 or 0.2.1-tester.57"
        type: string
        required: true
      channel:
        description: "stable or tester: which update file the app checks"
        type: string
        required: true
      require-update-signing:
        type: boolean
        default: false
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

env:
  CARGO_TERM_COLOR: never

jobs:
  build:
    name: Build (${{ matrix.name }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-14
            bundles: app,dmg
            files: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/macos/*.app.tar.gz
              src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          - name: Windows
            os: windows-latest
            bundles: nsis
            files: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/nsis/*.exe.sig
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - run: npm ci --no-audit --no-fund
      - run: node scripts/set-version.mjs "${{ inputs.version }}"
      # Surface compiler/bundler errors as annotations (readable without logging in).
      - run: echo "::add-matcher::.github/rust-problem-matcher.json"
      - name: Build app
        # Short commit id shown in the app and Diagnostics report. Retried because macOS
        # .dmg packaging (hdiutil) fails intermittently on hosted runners; a retry reuses
        # the compiled app, so it only repeats the packaging.
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CHANNEL: ${{ inputs.channel }}
          REQUIRE_SIGNING: ${{ inputs.require-update-signing }}
        run: |
          configs=()
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            configs+=(-c src-tauri/tauri.updates.conf.json)
          elif [ "$REQUIRE_SIGNING" = "true" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY isn't set: a release must be signed for in-app updates (ADR 0035)"
            exit 1
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY isn't set: this build can't be offered as an in-app update"
          fi
          if [ "$CHANNEL" = "tester" ]; then configs+=(-c src-tauri/tauri.tester.conf.json); fi
          for attempt in 1 2 3; do
            if WAVESCAN_BUILD="${GITHUB_SHA::7}" npm run tauri build -- --bundles ${{ matrix.bundles }} "${configs[@]}"; then
              exit 0
            fi
            echo "::warning::Build attempt ${attempt} failed; retrying"
            sleep 15
          done
          exit 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error
