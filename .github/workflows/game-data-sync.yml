name: Game data sync

# Keeps the bundled game data (src/data/) in step with Wuthering Tools, so data fixes made
# there reach Wavescan builds without anyone having to remember `npm run data:update`
# (ADR 0033). Installed copies download the newest data themselves at launch (ADR 0034);
# the bundled copy is what they use offline or before their first download. When the published scanner-data.json differs from the snapshot, this opens a
# pull request with the update (or refreshes the open one). A person still reviews and
# merges it, and CI runs on it like on any other PR.
#
# Needs: Settings → Actions → General → "Allow GitHub Actions to create and approve pull
# requests" turned on.

on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC
  workflow_dispatch:
  # Lets the Wuthering Tools deploy ask for a sync right away (it needs a token for this repo).
  repository_dispatch:
    types: [scanner-data-published]

concurrency:
  group: game-data-sync
  cancel-in-progress: false

env:
  BRANCH: chore/sync-game-data

jobs:
  sync:
    name: Sync game data
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the sync branch
      pull-requests: write # open / update the PR
      actions: write # start CI on the PR (see the last step)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund

      # scanner-data.json, and scanner-assets.json (the pictures) when the data names new ones.
      - name: Fetch the game data
        id: fetch
        shell: bash
        run: |
          node scripts/update-scanner-data.mjs | tee "$RUNNER_TEMP/summary.txt"
          if git diff --quiet -- src/data; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the pull request
        if: steps.fetch.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Skip if the open sync PR already has exactly this data, so CI isn't rerun daily.
          if git fetch --quiet origin "$BRANCH" 2>/dev/null && git diff --quiet FETCH_HEAD -- src/data; then
            echo "The sync branch already has this data."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add src/data
          git commit --quiet -m "chore: sync game data from wuthering tools"
          git push --force origin "$BRANCH"

          {
            echo "Wuthering Tools published new game data, so this updates the bundled snapshot (ADR 0033)."
            echo
            echo "**Review by eye before merging.** Check that each change below is one you meant to make in Wuthering Tools. A wrong set or name here makes the scanner misread echoes."
            echo
            echo '```'
            cat "$RUNNER_TEMP/summary.txt"
            echo '```'
            echo
            echo "Opened by the \`Game data sync\` workflow. It force-pushes \`$BRANCH\`, so don't push your own commits to it."
          } > "$RUNNER_TEMP/body.md"

          state=$(gh pr view "$BRANCH" --json state --jq .state 2>/dev/null || true)
          if [ "$state" = "OPEN" ]; then
            gh pr edit "$BRANCH" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --base main --head "$BRANCH" \
              --title "chore: sync game data from wuthering tools" \
              --body-file "$RUNNER_TEMP/body.md"
          fi

          # Pushes made with the workflow token don't trigger other workflows (GitHub's guard
          # against loops), but a manual dispatch does, so start CI on the branch ourselves.
          gh workflow run ci.yml --ref "$BRANCH"
