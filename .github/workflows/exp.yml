# TEMPORARY experiment (branch exp/winocr-hp, never merged): why Windows OCR drops "HP".
name: EXP winocr
on:
  push:
    branches: [exp/winocr-hp]
permissions:
  contents: read
jobs:
  exp:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - run: npm ci --no-audit --no-fund
      - run: npx vite build
      - shell: pwsh
        run: |
          $cap = Get-WindowsCapability -Online -Name 'Language.OCR~~~en-US~0.0.1.0'
          if ($cap.State -ne 'Installed') { Add-WindowsCapability -Online -Name 'Language.OCR~~~en-US~0.0.1.0' }
      - shell: bash
        run: |
          E="cargo run --quiet --manifest-path src-tauri/Cargo.toml --example fixtures -- experiment"
          D=fixtures/screens/echoes/2880x1800
          $E $D/kronaclaw-plus25.png 0.713 0.4586 0.192 0.2425
          $E $D/kronaclaw-plus25.png 0.705 0.4586 0.200 0.2425
          $E $D/shadow-stepper-plus25.png 0.713 0.4163 0.262 0.038
          $E $D/shadow-stepper-plus25.png 0.713 0.4586 0.192 0.2425
          $E $D/kronaclaw-plus25.png 0.713 0.4986 0.05 0.03
