name: Tester build

# Unsigned test builds for the maintainer and community testers, published to a rolling
# "tester-build" pre-release (downloadable without a GitHub account). Official signed
# releases come from release.yml later (ADR 0011). Guide: docs/testing-guide.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tester-build
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never

jobs:
  build:
    name: Build (${{ matrix.name }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-14
            bundles: app,dmg
            files: src-tauri/target/release/bundle/dmg/*.dmg
          - name: Windows
            os: windows-latest
            bundles: nsis
            files: src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - run: npm ci --no-audit --no-fund
      - name: Build app
        # Short commit id shown in the app and Diagnostics report.
        shell: bash
        run: WAVESCAN_BUILD="${GITHUB_SHA::7}" npm run tauri build -- --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  publish:
    name: Publish tester build
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and notes
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          {
            echo "**Unsigned test build** from commit ${GITHUB_SHA::7}. Not an official release."
            echo
            echo "How to install and test: https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/testing-guide.md"
            echo
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
          } > ../notes.md
      - name: Replace the tester-build pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete tester-build --yes --cleanup-tag || true
          gh release create tester-build dist/* \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Tester build (${GITHUB_SHA::7})" \
            --notes-file notes.md
