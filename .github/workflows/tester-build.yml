name: Tester build

# Unsigned test builds for the maintainer and community testers, published to a rolling
# "tester-build" pre-release (downloadable without a GitHub account). Official signed
# releases come from release.yml later (ADR 0011). Guide: docs/testing-guide.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tester-build
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never

jobs:
  # Is the bundled game data the same as what Wuthering Tools publishes? A stale snapshot
  # doesn't block the build (the sync PR fixes it, ADR 0033), but it's flagged on the run
  # and in the release notes, so nobody tests old data without knowing.
  game-data:
    name: Game data freshness
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      status: ${{ steps.check.outputs.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - id: check
        shell: bash
        run: |
          code=0
          node scripts/update-scanner-data.mjs --check || code=$?
          case "$code" in
            0) echo "status=current" >> "$GITHUB_OUTPUT" ;;
            2) echo "status=stale" >> "$GITHUB_OUTPUT"
               echo "::warning::Bundled game data is older than wutheringtools.com. Merge the game-data sync PR (or run npm run data:update)." ;;
            *) echo "status=unknown" >> "$GITHUB_OUTPUT"
               echo "::warning::Couldn't compare the bundled game data with wutheringtools.com." ;;
          esac

  build:
    name: Build (${{ matrix.name }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-14
            bundles: app,dmg
            files: src-tauri/target/release/bundle/dmg/*.dmg
          - name: Windows
            os: windows-latest
            bundles: nsis
            files: src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - run: npm ci --no-audit --no-fund
      # Surface compiler/bundler errors as annotations (readable without logging in).
      - run: echo "::add-matcher::.github/rust-problem-matcher.json"
      - name: Build app
        # Short commit id shown in the app and Diagnostics report. Retried because macOS
        # .dmg packaging (hdiutil) fails intermittently on hosted runners; a retry reuses
        # the compiled app, so it only repeats the packaging.
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if WAVESCAN_BUILD="${GITHUB_SHA::7}" npm run tauri build -- --bundles ${{ matrix.bundles }}; then
              exit 0
            fi
            echo "::warning::Build attempt ${attempt} failed; retrying"
            sleep 15
          done
          exit 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  publish:
    name: Publish tester build
    needs: [build, game-data]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and notes
        env:
          GAME_DATA: ${{ needs.game-data.outputs.status }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          {
            echo "**Unsigned test build** from commit ${GITHUB_SHA::7}. Not an official release."
            echo
            if [ "$GAME_DATA" = "stale" ]; then
              echo "⚠️ Built with game data older than wutheringtools.com, so recent echo fixes may be missing."
              echo
            fi
            echo "How to install and test: https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/testing-guide.md"
            echo
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
          } > ../notes.md
      - name: Replace the tester-build pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete tester-build --yes --cleanup-tag || true
          gh release create tester-build dist/* \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Tester build (${GITHUB_SHA::7})" \
            --notes-file notes.md
