name: Tester build

# Test builds for the maintainer and community testers, published to a rolling
# "tester-build" pre-release (downloadable without a GitHub account). Installed tester
# builds update themselves to the next one: every build has a higher version
# (<next release>-tester.<run number>) and a signed latest.json (ADR 0035). Releases come
# from release.yml. Guide: docs/testing-guide.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tester-build
  cancel-in-progress: true

jobs:
  # Is the bundled game data the same as what Wuthering Tools publishes? A stale snapshot
  # doesn't block the build (the sync PR fixes it, ADR 0033), but it's flagged on the run
  # and in the release notes, so nobody tests old data without knowing.
  game-data:
    name: Game data freshness
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      status: ${{ steps.check.outputs.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - id: check
        shell: bash
        run: |
          code=0
          node scripts/update-scanner-data.mjs --check || code=$?
          case "$code" in
            0) echo "status=current" >> "$GITHUB_OUTPUT" ;;
            2) echo "status=stale" >> "$GITHUB_OUTPUT"
               echo "::warning::Bundled game data is older than wutheringtools.com. Merge the game-data sync PR (or run npm run data:update)." ;;
            *) echo "status=unknown" >> "$GITHUB_OUTPUT"
               echo "::warning::Couldn't compare the bundled game data with wutheringtools.com." ;;
          esac

  # The patch after the latest release, as a pre-release numbered by this workflow's run,
  # so every tester build is newer than the one before (0.2.1-tester.57).
  version:
    name: Version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          latest=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
          if [[ "$latest" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            base="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
          else
            base=$(node -p 'require("./package.json").version')
          fi
          echo "version=${base}-tester.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Tester build ${base}-tester.${GITHUB_RUN_NUMBER}"

  build:
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/build-app.yml
    with:
      version: ${{ needs.version.outputs.version }}
      channel: tester
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  publish:
    name: Publish tester build
    needs: [version, build, game-data]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - name: Update file for in-app updates
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir dist
          find artifacts -type f -exec mv {} dist/ \;
          # Only when the build was signed (TAURI_SIGNING_PRIVATE_KEY set).
          if ls dist/*.sig >/dev/null 2>&1; then
            node scripts/updater-manifest.mjs --dir dist --version "$VERSION" \
              --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/tester-build" \
              --notes "Tester build ${VERSION} from commit ${GITHUB_SHA::7}." > dist/latest.json
          else
            echo "::warning::No signed update files, so installed tester builds won't update to this one."
          fi
      - name: Checksums and notes
        env:
          GAME_DATA: ${{ needs.game-data.outputs.status }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          {
            echo "**Test build ${VERSION}** from commit ${GITHUB_SHA::7}. Not an official release. Installed tester builds update to it by themselves."
            echo
            if [ "$GAME_DATA" = "stale" ]; then
              echo "⚠️ Built with game data older than wutheringtools.com, so recent echo fixes may be missing."
              echo
            fi
            echo "How to install and test: https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/testing-guide.md"
            echo
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
          } > ../notes.md
      - name: Replace the tester-build pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release delete tester-build --yes --cleanup-tag || true
          gh release create tester-build dist/* \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Tester build ${VERSION} (${GITHUB_SHA::7})" \
            --notes-file notes.md
