name: Release

# Publishes a release that every installed copy updates to (ADR 0035): Actions → Release →
# Run workflow, on main, with the version. It builds both platforms at that version, signs
# the update files, tags the commit vX.Y.Z, and publishes a GitHub Release with latest.json
# (what installed copies check on launch), checksums and build attestations.
#
# Installers keep a fixed name too (Wavescan_x64-setup.exe, Wavescan_aarch64.dmg), so
# https://github.com/wavescan/wavescan/releases/latest/download/<name> always works.
#
# Windows Authenticode and Apple notarization (ADR 0011) aren't set up yet: the installers
# are unsigned for the OS, so people see SmartScreen / Gatekeeper once, when they install.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.2.0 (no v)"
        required: true
        type: string
      minimum-version:
        description: "Optional: versions older than this must update before scanning (a known bad version)"
        required: false
        type: string
      notes:
        description: "Optional: one line shown with the update. The release page lists the merged PRs too."
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Check the version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Newer than the latest release, from main, not already tagged
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          MINIMUM: ${{ inputs.minimum-version }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Run Release on main (it ran on $GITHUB_REF)."; exit 1
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 0.2.0, without a v."; exit 1
          fi
          if [ -n "$MINIMUM" ] && ! [[ "$MINIMUM" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Minimum version must look like 0.1.3."; exit 1
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "::error::v$VERSION is already released."; exit 1
          fi
          latest=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
          if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "${latest#v}" "$VERSION" | sort -V | tail -1)" != "$VERSION" ]; then
            echo "::error::$VERSION isn't newer than the latest release ($latest)."; exit 1
          fi

  build:
    needs: check
    permissions:
      contents: read
    uses: ./.github/workflows/build-app.yml
    with:
      version: ${{ inputs.version }}
      channel: stable
      require-update-signing: true
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - name: Installers, update file and checksums
        env:
          VERSION: ${{ inputs.version }}
          MINIMUM: ${{ inputs.minimum-version }}
          NOTES: ${{ inputs.notes }}
        run: |
          mkdir dist
          find artifacts -type f -exec mv {} dist/ \;
          cp dist/*_x64-setup.exe dist/Wavescan_x64-setup.exe
          cp dist/*_aarch64.dmg dist/Wavescan_aarch64.dmg
          args=(--dir dist --version "$VERSION" --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}")
          if [ -n "$NOTES" ]; then args+=(--notes "$NOTES"); fi
          if [ -n "$MINIMUM" ]; then args+=(--minimum-version "$MINIMUM"); fi
          node scripts/updater-manifest.mjs "${args[@]}" > dist/latest.json
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat latest.json
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.exe
            dist/*.dmg
            dist/*.app.tar.gz
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          NOTES: ${{ inputs.notes }}
        run: |
          {
            if [ -n "$NOTES" ]; then echo "$NOTES"; echo; fi
            echo "**Already have Wavescan?** It updates itself: you'll see \"Restart to update\"."
            echo
            echo "**New here?** Windows: \`Wavescan_x64-setup.exe\`. Mac (Apple Silicon): \`Wavescan_aarch64.dmg\`."
            echo
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } > notes.md
          gh release create "v$VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --title "Wavescan $VERSION" \
            --notes-file notes.md \
            --generate-notes \
            --latest
