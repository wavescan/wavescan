# Type-checks all macOS adapters (src-tauri/src/platform/macos/) from Linux, so
# `npm run check` catches macOS errors without a Mac. Works because the adapters use only
# pure-Rust objc2 bindings (no Swift/C build steps). Keep the dependency list in sync
# with src-tauri/Cargo.toml's macOS section.
[package]
name = "wavescan-macos-probe"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
objc2 = "0.6"
block2 = "0.6"
dispatch2 = "0.3"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString", "NSDictionary", "NSError", "NSObject"] }
objc2-screen-capture-kit = { version = "0.3", features = ["SCShareableContent", "SCStream", "objc2-core-media", "objc2-core-graphics", "block2", "dispatch2", "libc"] }
objc2-core-media = { version = "0.3", features = ["CMSampleBuffer", "CMTime", "objc2-core-video"] }
objc2-core-video = { version = "0.3", features = ["CVPixelBuffer", "CVImageBuffer", "CVBuffer", "CVReturn", "CVBase"] }
objc2-core-foundation = { version = "0.3", features = ["CFData", "CFCGTypes", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-graphics = { version = "0.3", features = ["CGImage", "CGDataProvider", "CGColorSpace", "CGEvent", "CGEventTypes", "CGRemoteOperation", "CGEventSource"] }
objc2-vision = { version = "0.3", features = ["VNRequest", "VNRecognizeTextRequest", "VNRequestHandler", "VNObservation", "VNTypes", "objc2-core-graphics"] }
objc2-app-kit = { version = "0.3", features = ["NSRunningApplication", "NSWorkspace"] }
objc2-application-services = { version = "0.3", features = ["HIServices", "AXUIElement"] }

# Lint policy: docs/adr/0015-rust-code-standards.md. CI runs clippy with `-D warnings`,
# so every "warn" below fails the build. Allow a lint only on a specific item, with a reason.
[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
undocumented_unsafe_blocks = "deny"
missing_errors_doc = "warn"
