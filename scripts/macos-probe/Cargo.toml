# Type-checks the macOS adapters that don't need Apple's SDK (Vision OCR, Core Graphics
# input) from Linux, so `npm run check` catches most macOS errors without a Mac.
# capture.rs / window.rs use ScreenCaptureKit (a Swift bridge) and are checked on CI's
# macOS runner only. Keep the objc2 dependency versions/features in sync with
# src-tauri/Cargo.toml.
[package]
name = "wavescan-macos-probe"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString", "NSDictionary", "NSError"] }
objc2-core-foundation = { version = "0.3", features = ["CFData", "CFCGTypes", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-graphics = { version = "0.3", features = ["CGImage", "CGDataProvider", "CGColorSpace", "CGEvent", "CGEventTypes", "CGRemoteOperation", "CGEventSource"] }
objc2-vision = { version = "0.3", features = ["VNRequest", "VNRecognizeTextRequest", "VNRequestHandler", "VNObservation", "VNTypes", "objc2-core-graphics"] }
objc2-app-kit = { version = "0.3", features = ["NSRunningApplication", "NSWorkspace"] }
objc2-application-services = { version = "0.3", features = ["HIServices", "AXUIElement"] }

# Lint policy: docs/adr/0015-rust-code-standards.md. CI runs clippy with `-D warnings`,
# so every "warn" below fails the build. Allow a lint only on a specific item, with a reason.
[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
undocumented_unsafe_blocks = "deny"
missing_errors_doc = "warn"
